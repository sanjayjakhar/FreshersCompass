services:
  # 1. MongoDB Database Container
  mongo:
    image: mongo:7.0
    container_name: fresherscompass-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - fc-network
    # `mongosh ping` is the cheapest command that still proves the server is
    # accepting connections, not merely that the container process is alive.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 2. Python FastAPI AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: fresherscompass-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - BACKEND_URL=http://backend:5000
      - AI_SERVICE_INTERNAL_KEY=ai_internal_secret_fc_98u23r09ju023jf
    env_file:
      - path: ./ai-service/.env
        required: false
    networks:
      - fc-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).getcode()==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 3. Node.js Express Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fresherscompass-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    # Wait for real readiness, not just for the container to be created.
    # Without `condition: service_healthy` the backend boots while Mongo is still
    # initialising and the first Mongoose connection fails outright.
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      - PORT=5000
      # server.js reads MONGODB_URI (not MONGO_URI), so the name must match or the
      # container silently falls back to mongodb://localhost:27017.
      - MONGODB_URI=mongodb://mongo:27017/FreshersCompass
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SERVICE_INTERNAL_KEY=ai_internal_secret_fc_98u23r09ju023jf
      - CLIENT_URL=http://localhost:5173
      - JWT_SECRET=fc_jwt_secret_dev_key_fallback
      # Surfaced by /api/health once GITHUB_TOKEN is set here or in backend/.env.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    env_file:
      - path: ./backend/.env
        required: false
    networks:
      - fc-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 4. React Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite inlines this at build time, so it has to arrive as a build arg.
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:5000/api}
    container_name: fresherscompass-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fc-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mongo_data:
    driver: local

networks:
  fc-network:
    driver: bridge